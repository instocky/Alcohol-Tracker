<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Preset editor — add option</title>
<style>
  :root {
    --bg: #fafaf7;
    --surface: #ffffff;
    --fg: #1a1a1a;
    --fg-muted: #6b6b6b;
    --fg-faint: #a3a3a3;
    --line: #ececec;
    --line-strong: #d4d4d4;
    --accent: #0f7a52;
    --accent-bg: #e8f3ed;
    --warn: #b66a00;
    --warn-bg: #fbf1e3;
    --today: #1a1a1a;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow-pop: 0 8px 24px rgba(0, 0, 0, 0.07);
    --tap: 36px;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #e9e9e6;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--fg);
  }

  .stage {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 16px;
  }

  .stage-row {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
  }

  .label {
    font-size: 11px;
    color: var(--fg-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    text-align: center;
    margin-top: 6px;
  }

  .frame {
    position: relative;
    width: 360px;
    height: 600px;
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    box-shadow: var(--shadow-pop);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .screen-heading {
    padding: 14px 14px 8px;
    font-size: 16px;
    font-weight: 600;
    color: var(--fg);
  }

  .settings-section { margin: 0 14px 14px; }
  .section-title {
    font-size: 11px;
    color: var(--fg-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 8px 0;
    font-weight: 600;
  }

  .preset-list {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .preset-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .preset-row:last-of-type { border-bottom: none; }
  .preset-row .left {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 500;
  }
  .preset-row .emoji { font-size: 18px; width: 24px; text-align: center; }
  .preset-row .chev  { color: var(--fg-faint); font-size: 18px; }

  .preset-editor {
    background: var(--bg);
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .editor-lbl {
    font-size: 10px;
    color: var(--fg-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 4px;
  }

  .preset-editor input {
    font: inherit;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--fg);
  }
  .preset-editor input:disabled { color: var(--fg-muted); }

  /* === Options header: title + small + on the right === */
  .opts-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
  }
  .opts-head .editor-lbl { margin-top: 0; }

  .opt-add-icon {
    width: 22px;
    height: 22px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--surface);
    color: var(--fg-muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .opt-add-icon:hover {
    background: var(--accent-bg);
    color: var(--accent);
    border-color: var(--accent);
  }
  .opt-add-icon:active { transform: scale(0.92); }

  /* === Options list === */
  .opts-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .opt-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .opt-row input { width: 72px; }
  .opt-row .opt-lbl {
    color: var(--fg-muted);
    font-size: 12px;
  }

  /* === Editor actions === */
  .editor-actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    justify-content: flex-end;
  }
  .editor-actions button {
    font: inherit;
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .btn-cancel { background: var(--surface); color: var(--fg); }
  .btn-save   { background: var(--fg); color: #fff; border-color: var(--fg); }

  .editor-actions .btn-delete {
    width: 32px;
    height: 32px;
    padding: 0;
    margin-right: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--fg-muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .editor-actions .btn-delete:hover {
    background: var(--warn-bg);
    border-color: var(--warn);
    color: var(--warn);
  }
</style>
</head>
<body>
<div class="stage">
  <div>
    <div class="stage-row">

      <!-- ============ STATE 1: one option (baseline) ============ -->
      <div>
        <div class="frame">
          <div class="screen-heading">Настройки</div>
          <div class="settings-section">
            <div class="section-title">Пресеты напитков</div>
            <div class="preset-list">
              <div class="preset-row">
                <div class="left"><span class="emoji">🥃</span><span>Водка</span></div>
                <span class="chev">›</span>
              </div>
              <div class="preset-row">
                <div class="left"><span class="emoji">🍷</span><span>Вино</span></div>
                <span class="chev">›</span>
              </div>
              <div class="preset-row">
                <div class="left"><span class="emoji">🍺</span><span>Пиво</span></div>
                <span class="chev">›</span>
              </div>
              <div class="preset-row">
                <div class="left"><span class="emoji">🍸</span><span>Новый напиток</span></div>
                <span class="chev">⌄</span>
              </div>
              <div class="preset-editor">
                <div class="editor-lbl">Название</div>
                <input type="text" value="Новый напиток" disabled>

                <div class="editor-lbl">ABV, %</div>
                <input type="number" value="12">

                <div class="opts-head">
                  <div class="editor-lbl">Объёмы (мл)</div>
                  <button class="opt-add-icon" aria-label="Добавить объём" title="Добавить объём">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                  </button>
                </div>
                <div class="opts-list">
                  <div class="opt-row">
                    <input type="number" value="50">
                    <span class="opt-lbl">50 мл</span>
                  </div>
                </div>

                <div class="editor-actions">
                  <button class="btn-delete" aria-label="Удалить пресет" title="Удалить пресет">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
                  </button>
                  <button class="btn-cancel">Отмена</button>
                  <button class="btn-save">Сохранить</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="label">1 опция — + рядом с title</div>
      </div>

      <!-- ============ STATE 2: three options (rich case) ============ -->
      <div>
        <div class="frame">
          <div class="screen-heading">Настройки</div>
          <div class="settings-section">
            <div class="section-title">Пресеты напитков</div>
            <div class="preset-list">
              <div class="preset-row">
                <div class="left"><span class="emoji">🥃</span><span>Водка</span></div>
                <span class="chev">›</span>
              </div>
              <div class="preset-row">
                <div class="left"><span class="emoji">🍷</span><span>Вино</span></div>
                <span class="chev">›</span>
              </div>
              <div class="preset-row">
                <div class="left"><span class="emoji">🍺</span><span>Пиво</span></div>
                <span class="chev">›</span>
              </div>
              <div class="preset-row">
                <div class="left"><span class="emoji">🍸</span><span>Новый напиток</span></div>
                <span class="chev">⌄</span>
              </div>
              <div class="preset-editor">
                <div class="editor-lbl">Название</div>
                <input type="text" value="Новый напиток" disabled>

                <div class="editor-lbl">ABV, %</div>
                <input type="number" value="12">

                <div class="opts-head">
                  <div class="editor-lbl">Объёмы (мл)</div>
                  <button class="opt-add-icon" aria-label="Добавить объём" title="Добавить объём">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                  </button>
                </div>
                <div class="opts-list">
                  <div class="opt-row">
                    <input type="number" value="50">
                    <span class="opt-lbl">50 мл</span>
                  </div>
                  <div class="opt-row">
                    <input type="number" value="150">
                    <span class="opt-lbl">150 мл</span>
                  </div>
                  <div class="opt-row">
                    <input type="number" value="500">
                    <span class="opt-lbl">500 мл</span>
                  </div>
                </div>

                <div class="editor-actions">
                  <button class="btn-delete" aria-label="Удалить пресет" title="Удалить пресет">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
                  </button>
                  <button class="btn-cancel">Отмена</button>
                  <button class="btn-save">Сохранить</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="label">3 опции — + в header, без крестиков</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
